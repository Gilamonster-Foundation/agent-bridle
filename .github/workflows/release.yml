# agent-bridle release workflow.
#
# HOOK PARITY: publish sequencing mirrors the `publish-crates` recipe in
# justfile. When editing the crate list or order here, update the justfile
# recipe to match.
#
# Triggers:
#  - Tag push `v*`           → build MCP binary + publish all crates to crates.io
#  - workflow_dispatch       → manual build (no upload)
#
# Secrets (Settings → Secrets and variables → Actions):
#  - CARGO_REGISTRY_TOKEN — crates.io publish token (account scope)

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Release identity preflight ────────────────────────────────────────

  release-preflight:
    name: Verify release identity
    runs-on: ubuntu-latest
    outputs:
      # Whether this release is a SemVer pre-release, derived from the version
      # itself rather than hard-coded. Consumed by `github-release` so an RC can
      # never be published as a stable release.
      prerelease: ${{ steps.identity.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Require tag to match the workspace version
        id: identity
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          manifest = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          version = manifest["workspace"]["package"]["version"]
          expected = f"v{version}"
          release_ref = os.environ["RELEASE_REF"]
          release_tag = os.environ["RELEASE_TAG"]

          if release_ref.startswith("refs/tags/") and release_tag != expected:
              raise SystemExit(
                  f"release tag {release_tag!r} does not match "
                  f"workspace version {version!r}; expected {expected!r}"
              )

          # SemVer 2.0.0 §9: the optional dot-separated identifiers after the
          # first '-' following patch ARE the pre-release. Parsed rather than
          # sniffed for a substring, so a malformed version fails the preflight
          # instead of silently deciding the release's public status.
          semver = re.fullmatch(
              r"(?P<core>\d+\.\d+\.\d+)"
              r"(?:-(?P<pre>[0-9A-Za-z.-]+))?"
              r"(?:\+(?P<build>[0-9A-Za-z.-]+))?",
              version,
          )
          if semver is None:
              raise SystemExit(
                  f"workspace version {version!r} is not valid SemVer; refusing to "
                  f"guess whether this release is a pre-release"
              )
          prerelease = semver.group("pre") is not None

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"prerelease={'true' if prerelease else 'false'}\n")

          if release_ref.startswith("refs/tags/"):
              kind = "pre-release" if prerelease else "stable release"
              print(f"release identity verified: {release_tag} ({kind})")
          else:
              print(f"manual build for workspace version {version}")
          PY

  # ── Build the agent-bridle-mcp binary ─────────────────────────────────

  build-mcp-binary:
    name: Build agent-bridle-mcp (${{ matrix.label }})
    needs: [release-preflight]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            ext: ""
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            ext: ""
          # Windows also ships agent-bridle-aclaunch.exe — the AppContainer launcher
          # the L3 backend shells out to (agent-bridle#51); without it a Windows
          # release cannot use kernel confinement.
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            ext: ".exe"
            aclaunch: "1"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build agent-bridle-mcp (+ aclaunch on Windows)
        shell: bash
        run: |
          # Release artifacts must carry the native L3 backend for their target.
          # `os-sandbox` enables all three cfg-gated backends; each is inert away
          # from its own OS.
          cargo build --release --locked --target ${{ matrix.target }} \
            -p agent-bridle-mcp --features os-sandbox
          # The AppContainer launcher is Windows-only; build it there so it ships.
          if [ -n "${{ matrix.aclaunch }}" ]; then
            cargo build --release --locked --target ${{ matrix.target }} \
              -p agent-bridle-aclaunch
          fi

      - name: Stage archive
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME//\//-}"
          [ -n "$VERSION" ] || VERSION="dev"
          STAGE="agent-bridle-mcp-${VERSION}-${{ matrix.label }}"
          BIN="target/${{ matrix.target }}/release"
          mkdir -p "$STAGE"
          cp "$BIN/agent-bridle-mcp${{ matrix.ext }}" "$STAGE/"
          # Windows: bundle the AppContainer launcher (required by the L3 backend).
          if [ -n "${{ matrix.aclaunch }}" ]; then
            cp "$BIN/agent-bridle-aclaunch${{ matrix.ext }}" "$STAGE/"
          fi
          cp LICENSE NOTICE README.md "$STAGE/"
          tar -czf "$STAGE.tar.gz" "$STAGE"
          echo "ARCHIVE=$STAGE.tar.gz" >> "$GITHUB_ENV"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-bridle-mcp-${{ matrix.label }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 30

  # ── GitHub release (tag-only) ─────────────────────────────────────────

  github-release:
    name: GitHub release (${{ github.ref_name }})
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    # `release-preflight` is a needs-dependency for its `prerelease` OUTPUT, not
    # only for ordering: without it the expression below resolves to empty and
    # an RC would be published as a stable release.
    needs: [release-preflight, build-mcp-binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts/
      - name: Collect archives
        run: |
          mkdir -p dist
          find all-artifacts -type f -name '*.tar.gz' -exec cp {} dist/ \;
          ls -la dist/
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "agent-bridle ${{ github.ref_name }}"
          draft: true
          # Derived from the workspace version's SemVer pre-release field by
          # `release-preflight` — `v0.8.0-rc.N` is a pre-release, `v0.8.0` is
          # not. Previously hard-coded to `false`, which would have marked every
          # RC on the 0.8.0 train as a stable release.
          prerelease: ${{ needs.release-preflight.outputs.prerelease }}
          generate_release_notes: true
          files: dist/*

  # ── Publish to crates.io (tag-only, topological order) ────────────────
  #
  # Order is load-bearing: each crate must land before its dependents.
  # This is deliberately one job and one shell loop: GitHub Actions does not
  # guarantee matrix execution order, even when max-parallel is one.
  #
  # Internal-only workspace packages (`publish = false`) are deliberately
  # absent: aclaunch ships inside the Windows binary archive; config and jaild
  # are host/deployment internals; ceremony and gateway are non-public work.
  # agent-bridle-py is also excluded: PyO3 arm64 linker issues on the GitHub
  # Actions macOS runner make it unpublishable here. Publish its wheel manually
  # or via a maturin job if/when needed.

  publish-crates:
    name: Publish Agent Bridle crates → crates.io
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [release-preflight, build-mcp-binary]
    runs-on: ubuntu-latest
    env:
      # HOOK PARITY: keep this exact dependency order aligned with the
      # `publish-crates` recipe in justfile.
      PUBLISH_CRATES: >-
        agent-bridle-fdguard
        agent-bridle-core
        agent-bridle-tool-shell
        agent-bridle-tool-web
        agent-bridle
        agent-bridle-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: publish-crates

      - name: Verify the public package plan
        run: |
          set -euo pipefail
          metadata="${RUNNER_TEMP:?}/agent-bridle-workspace-metadata.json"
          cargo metadata --no-deps --format-version 1 > "${metadata}"
          METADATA_PATH="${metadata}" python3 - <<'PY'
          import json
          import os

          plan = os.environ["PUBLISH_CRATES"].split()
          with open(os.environ["METADATA_PATH"], encoding="utf-8") as source:
              packages = json.load(source)["packages"]

          names = {package["name"] for package in packages}
          publishable = {
              package["name"]
              for package in packages
              if package.get("publish") is None
              or "crates-io" in package["publish"]
          }
          dependencies = {
              package["name"]: {
                  dependency["name"]
                  for dependency in package["dependencies"]
                  if dependency["name"] in names
                  and (
                      dependency.get("kind") != "dev"
                      or dependency.get("req") != "*"
                  )
              }
              for package in packages
          }

          errors = []
          duplicates = sorted({crate for crate in plan if plan.count(crate) > 1})
          for crate in duplicates:
              errors.append(f"{crate!r} appears more than once")
          for crate in sorted(publishable - set(plan)):
              errors.append(f"publishable workspace crate {crate!r} is missing")
          for crate in plan:
              if crate not in names:
                  errors.append(f"{crate!r} is not a workspace package")
              elif crate not in publishable:
                  errors.append(f"{crate!r} is not publishable to crates.io")

          positions = {crate: index for index, crate in enumerate(plan)}
          for crate in plan:
              for dependency in dependencies.get(crate, set()):
                  if dependency not in positions:
                      errors.append(
                          f"{crate!r} depends on omitted workspace crate "
                          f"{dependency!r}"
                      )
                  elif positions[dependency] > positions[crate]:
                      errors.append(
                          f"{crate!r} precedes its dependency {dependency!r}"
                      )

          if errors:
              for error in errors:
                  print(f"::error::publish plan: {error}")
              raise SystemExit(1)

          print(
              f"publish plan OK: {len(plan)} crates, exact coverage, "
              "topological order"
          )
          PY

      - name: Verify legal files in every public package
        run: |
          set -euo pipefail
          for crate in ${PUBLISH_CRATES}; do
            for legal_file in LICENSE NOTICE; do
              if [ ! -L "${crate}/${legal_file}" ] ||
                 [ "$(readlink "${crate}/${legal_file}")" != "../${legal_file}" ]; then
                echo "::error::${crate}/${legal_file} must link to ../${legal_file}"
                exit 1
              fi
            done
            files="$(cargo package --list --locked -p "${crate}")"
            grep -qx 'LICENSE' <<<"${files}"
            grep -qx 'NOTICE' <<<"${files}"
            echo "${crate}: LICENSE + NOTICE present"
          done

      - name: Verify the independent root package without publish credentials
        run: cargo publish --dry-run --locked -p agent-bridle-core

      - name: Confirm CARGO_REGISTRY_TOKEN is mounted
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN not set — add it under Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "CARGO_REGISTRY_TOKEN: present (${#CARGO_REGISTRY_TOKEN} chars)"

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # Verification above is intentionally token-free. `--no-verify` here
        # prevents dependency build scripts or proc macros from inheriting the
        # publish credential while Cargo performs the upload.
        run: |
          set -euo pipefail
          for crate in ${PUBLISH_CRATES}; do
            published=0
            publish_err="${RUNNER_TEMP:?}/publish-${crate}.err"
            for attempt in 1 2 3 4 5 6; do
              if cargo publish -p "${crate}" --locked --no-verify 2>"${publish_err}"; then
                cat "${publish_err}" >&2 || true
                echo "published ${crate}"
                published=1
                break
              elif grep -qiE 'already (exists|uploaded)|is already uploaded|already published' "${publish_err}"; then
                cat "${publish_err}" >&2
                echo "::notice::${crate} already published at this version — skipping"
                published=1
                break
              elif grep -qi '429 Too Many Requests' "${publish_err}"; then
                cat "${publish_err}" >&2
                wait=$((attempt * 90))
                echo "::warning::crates.io rate-limited on ${crate} — waiting ${wait}s, retry ${attempt}/6"
                sleep "$wait"
              elif grep -qiE 'no matching package named|failed to select a version for the requirement' "${publish_err}"; then
                cat "${publish_err}" >&2
                wait=$((attempt * 30))
                echo "::warning::dependency of ${crate} is not yet visible in the crates.io index — waiting ${wait}s, retry ${attempt}/6"
                sleep "$wait"
              else
                cat "${publish_err}" >&2
                exit 1
              fi
            done
            if [ "${published}" -ne 1 ]; then
              echo "::error::${crate} failed after 6 attempts"
              exit 1
            fi
          done
          echo "All Agent Bridle crates published."
