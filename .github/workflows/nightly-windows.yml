name: nightly-windows

# Scheduled Windows AppContainer verification. The push/PR `CI` workflow already runs
# the `check-windows` job on every change; this nightly run catches intermittent
# AppContainer / kernel-proof flakiness and regressions on days with no pushes, and
# re-exercises the real kernel boundary on a fresh runner image. The `nightly-windows`
# repo label tracks issues that need this host to verify.
on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  windows-appcontainer:
    name: nightly — Windows AppContainer backend + kernel proofs
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy (Windows-only AppContainerSandbox + launcher)
        run: cargo clippy --workspace --exclude agent-bridle-py --all-targets --all-features -- -D warnings

      - name: Test the AppContainer backend (core proofs)
        run: cargo test -p agent-bridle-core --features windows-appcontainer

      - name: Test the agent-bridle-aclaunch launcher (unit)
        run: cargo test -p agent-bridle-aclaunch --bins

      # Real kernel-enforcement proofs — hard-required (BRIDLE_REQUIRE_APPCONTAINER),
      # one cargo invocation per step so each exit code is checked independently.
      - name: AppContainer fs/exec kernel proofs (require the boundary)
        env:
          BRIDLE_REQUIRE_APPCONTAINER: "1"
        run: cargo test -p agent-bridle-aclaunch --test kernel_proofs -- --test-threads=1

      - name: AppContainer net-axis kernel proofs (require the boundary)
        env:
          BRIDLE_REQUIRE_APPCONTAINER: "1"
          BRIDLE_REQUIRE_ELEVATED: "1" # runner is elevated → require the loopback proof
        run: cargo test -p agent-bridle-aclaunch --test net_proofs -- --test-threads=1

      - name: AppContainer inherited-HANDLE proof (require the boundary)
        env:
          BRIDLE_REQUIRE_APPCONTAINER: "1"
        run: cargo test -p agent-bridle-aclaunch --test handle_inheritance -- --test-threads=1

      # Keep Git's NUL-device startup requirement separate from the launcher's
      # caller-stdio delivery guarantee; print the current runner observation.
      - name: AppContainer standard-handle delivery proof (require the boundary)
        env:
          BRIDLE_REQUIRE_APPCONTAINER: "1"
        run: cargo test -p agent-bridle-aclaunch --test stdio_inheritance -- --test-threads=1 --nocapture

      - name: AppContainer fail-closed setup proofs (require the boundary)
        env:
          BRIDLE_REQUIRE_APPCONTAINER: "1"
        run: cargo test -p agent-bridle-aclaunch --test fail_closed -- --test-threads=1

      - name: AppContainer adversarial filesystem proofs (require the boundary)
        env:
          BRIDLE_REQUIRE_APPCONTAINER: "1"
        run: cargo test -p agent-bridle-aclaunch --test fs_adversarial -- --test-threads=1

      # Native Git ownership regression (#404): require the actual Git-for-
      # Windows/AppContainer path, including the caller-controlled exact
      # `safe.directory` recovery shape. Do not permit an unavailable Git
      # runtime to turn this proof into a passing skip.
      - name: AppContainer native Git ownership regression (require real Git)
        env:
          BRIDLE_REQUIRE_APPCONTAINER: "1"
          BRIDLE_REQUIRE_NATIVE_GIT: "1"
          BRIDLE_REQUIRE_OWNER_TRANSFER_REGRESSION: "1"
        run: cargo test -p agent-bridle-aclaunch --test git_ownership -- --test-threads=1

      - name: AppContainer descendant containment proofs (require the boundary)
        env:
          BRIDLE_REQUIRE_APPCONTAINER: "1"
        run: cargo test -p agent-bridle-aclaunch --test descendants -- --test-threads=1

      - name: AppContainer local-deputy proof (require the boundary)
        env:
          BRIDLE_REQUIRE_APPCONTAINER: "1"
        run: cargo test -p agent-bridle-aclaunch --test local_deputy -- --test-threads=1

      - name: AppContainer Newt CONFINED route contract
        run: cargo test -p agent-bridle-tool-shell --features windows-appcontainer --test windows_appcontainer_contract -- --test-threads=1
