name: security-audit

# Privacy + secret-leak guardrails. This MUST stay green: it is the gate that
# keeps secrets and internal/operational specifics out of this public repository.
#
# HOOK PARITY: the first three jobs here are mirrored locally by the `check-security`
# recipe in justfile (run by .githooks/pre-push) and by .pre-commit-config.yaml.
# When editing this file, update BOTH to match — the push hook is the gate that
# stops a leak before it leaves the machine (#350).
#
# This workflow stays the authoritative gate: the local hook skips the gitleaks
# leg when the binary is absent, so a green push does not imply a local scan ran.
#
# `cargo-audit` is CI-only (a whole-lockfile audit; CRAFT-14 keeps those out of
# the changed-scope hook). .githooks/pre-push names it as such.

on:
  push:
  pull_request:
  # Daily: new RustSec advisories land against an unchanged Cargo.lock.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  secret-scan:
    name: gitleaks secret scan
    runs-on: ${{ vars.GMF_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Run the open-source gitleaks binary directly. The gitleaks-action wrapper
      # requires a paid GITLEAKS_LICENSE for ORGANIZATION repos; the binary does not.
      - name: Install gitleaks
        run: |
          VER=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Run gitleaks
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --verbose

  internal-specifics:
    name: internal-specifics linter
    runs-on: ${{ vars.GMF_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - name: Run internal-specifics linter
        run: bash scripts/check-internal-specifics.sh

  docs-accuracy:
    name: docs-accuracy guard (no stale brush-runtime claims)
    runs-on: ${{ vars.GMF_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - name: Run docs-accuracy guard
        run: bash scripts/check-docs-accuracy.sh

  cargo-audit:
    name: Security audit (cargo-audit)
    runs-on: ${{ vars.GMF_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on any RustSec advisory against Cargo.lock.
      - name: cargo audit
        run: cargo audit
