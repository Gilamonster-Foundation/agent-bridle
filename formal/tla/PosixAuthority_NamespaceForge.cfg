\* BUG mode "NamespaceForge": TLC MUST report an Inv violation (counterexample) — it
\* breaks NamespaceNonAmplification. Documents a POSIX projection bridle must NOT ship.
\* Run: tlc -config PosixAuthority_NamespaceForge.cfg PosixAuthority.tla
SPECIFICATION Spec
CONSTANT Mode = "NamespaceForge"
CONSTANT Objects = {o1, o2}
CONSTANT Rights = {r, w}
INVARIANT Inv
