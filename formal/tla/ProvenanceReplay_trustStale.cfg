\* TrustStaleEvidence (the bug): acceptance does NOT re-check binding/session.
\* Measure -> Crash -> Restart -> Accept replays a stale evidence into a new
\* session -> L5_ExactBinding AND L7_NoStaleReplay both fail (counterexample).
SPECIFICATION Spec
INVARIANT Inv
CONSTANTS
  Grants = {g1, g2}
  Fences = {f1, f2}
  MaxEpoch = 2
  Design = "TrustStaleEvidence"
