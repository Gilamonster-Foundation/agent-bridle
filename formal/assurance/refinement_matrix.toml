formal_claim  = "within/admit (exact); Unknown elsewhere = L6 fail-closed"
native_test   = "agent-bridle-tool-shell/tests/child_network_seccomp_real.rs (UDP + forked-descendant socket denied)"
residual      = "net:none under DEFAULT LandlockOnly (io_uring/UDP open) ⇒ Unknown; hostname allowlists inexpressible ⇒ Unknown"
