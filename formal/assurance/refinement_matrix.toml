formal_claim  = "within/admit (L1..L3)"
native_test   = "real_spawn.rs (child + grandchild write denied outside scope)"
residual      = "E1 writable-symlink root ⇒ Unknown"
class         = "bounded"

[fs_write.macos]
projection    = "LEGACY/PARTIAL: from_delegated/verbatim projection; this train does not certify a faithful Seatbelt fs_write projection"
primitive     = "SBPL (deny file-write*) + re-allow roots + device sinks"
formal_claim  = "within/admit at caveats grain only; faithful applied-authority projection remains pending"
native_test   = "agent-bridle-core/src/sandbox.rs::fs_write_is_kernel_enforced_outside_scope_denied_inside_allowed (macOS seatbelt_kernel_tests: in-scope write allowed, out-of-scope write denied)"
residual      = "none beyond I15 verbatim"
class         = "verbatim"

