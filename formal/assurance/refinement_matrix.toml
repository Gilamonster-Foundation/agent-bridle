primitive     = "Landlock AccessFs::Execute on resolved program files + loader_paths"
formal_claim  = "within/admit (L1..L3); descendant non-escalation = TLA T5"
native_test   = "real_spawn.rs (exec closure incl. bash)"
residual      = "ld.so mmap-exec trampoline ⇒ report strength = interceptor (ADR 0011 D7)"
