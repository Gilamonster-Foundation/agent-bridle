[exec.macos]
projection    = "from_delegated placeholder"
primitive     = "SBPL (deny process-exec*) + re-allow granted programs — governs interior execs of ALL descendants"
formal_claim  = "within/admit at caveats grain; TLA T5 descendant non-escalation"
