[[claim]]
id            = "WIN-E2-ENV-NO-AMBIENT"
platform      = "windows"
statement     = "A parent secret that was not explicitly delegated never reaches the confined child's environment."
lean_theorem  = []
tla_invariant = ["T6_EnvDelegation@AuthorityLifecycle_AmbientEnv.cfg"]
rust_test     = []
