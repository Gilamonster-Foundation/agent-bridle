# ── POSIX authority projection (ADR 0026) — MODEL half proved, OS half held ───
# These claims establish the four properties of the POSIX projection at the MODEL
# level (Lean + TLA+). They are status="held": the model is proved and axiom-
# audited, but no OS-refinement native evidence exists yet (the projection is
# architecture-before-implementation; the first executable slice is #319). They
# MUST NOT be marked "proved" until a hostile-child native test lands per the
# release-certification rule. See docs/adr/0026-posix-authority-projection.md.
[[claim]]
id            = "POSIX-COMPLETE-MEDIATION"
platform      = "all"
statement     = "Every permitted POSIX operation's required authority is within the process's effective authority, and from a well-formed start every reachable state keeps fds ⊑ effective (no resolve/derive/operate sequence amplifies authority beyond the grant)."
lean_theorem  = ["Ceremony.Posix.complete_mediation", "Ceremony.Posix.reach_preserves_wf"]
tla_invariant = ["NoAuthorityAmplification@PosixAuthority_Amplify.cfg"]
rust_test     = []
native_test_fn = ["agent-bridle-tool-shell/tests/real_spawn.rs::real_ambient_fd_is_not_inherited", "agent-bridle-tool-shell/tests/real_spawn.rs::real_ambient_fd_is_not_inherited_macos", "agent-bridle-fdguard/tests/hostile_fds.rs::an_ambient_socket_descriptor_is_closed_in_the_confined_child", "agent-bridle-fdguard/tests/hostile_fds.rs::a_duplicated_descriptor_is_closed_in_the_confined_child", "agent-bridle-fdguard/tests/hostile_fds.rs::a_descriptor_near_the_top_of_the_table_is_closed_in_the_confined_child", "agent-bridle-fdguard/tests/hostile_fds.rs::concurrent_descriptor_creation_never_reaches_the_confined_child", "agent-bridle-fdguard/tests/hostile_fds.rs::the_kernel_refuses_a_descriptor_at_or_above_the_derived_ceiling", "agent-bridle-fdguard/tests/hostile_fds.rs::delegated_stdio_survives_the_confined_spawn", "agent-bridle-fdguard/tests/hostile_fds.rs::a_missing_confined_program_still_reports_not_found"]
evidence_cid  = "held:phase1d"
premise       = "ASM-POSIX-DESCRIPTOR (now PARTIAL, #319 slices 1+2): model proved (Ceremony.Posix.reach_preserves_wf, PosixAuthority.tla faithful cfg holds []Inv), AND the real-path ambient-fd leak is closed on Linux (close_range) and macOS (an FD_CLOEXEC sweep over a bound derived from min(RLIMIT_NOFILE, kern.maxfilesperproc) widened to the live /dev/fd table; an unbounded universe REFUSES the spawn, #352) — every confined-spawn site closes fds >= 3 via agent-bridle-fdguard, proven by the native tests. Windows confined path goes via aclaunch's HANDLE_LIST; the std-path Windows residual + /proc-reopen re-mediation remain design; RC-cert pending, so NOT proved."
status        = "partial"

