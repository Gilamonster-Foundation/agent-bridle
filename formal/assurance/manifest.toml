evidence_cid  = "held:phase1d"
impl_sha      = "523038d827a92bf564b9b115ef8449eb8555100a"
premise       = "none — model theorem is unconditional; native test proves the OS refinement"
status        = "partial"   # native env test passes on real Windows 11 (#338); merge pending

