[[claim]]
id            = "PROVENANCE-CONTINUITY"
platform      = "all"
statement     = "Evidence attests the applied fence it claims (matching CID); no silent substitution of an unrelated object across authority-bearing handoffs (T7)."
lean_theorem  = []
tla_invariant = ["T7_ProvenanceContinuity@AuthorityLifecycle_SubstituteEvidence.cfg"]
rust_test     = []
native_test   = []
evidence_cid  = "held:phase1d"
premise       = "ASM-CID: modeled with Cid(x)=x (injective, uninterpreted). The runtime chain does NOT yet attach content CIDs (held in the ceremony P1 layer) — so this is a MODEL property, not a wired runtime guarantee."
