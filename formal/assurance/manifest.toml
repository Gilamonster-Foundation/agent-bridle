# ── Portable authority-algebra claims (platform-neutral core) ────────────────
[[claim]]
id            = "ADMIT-NO-SILENT-WIDENING"
platform      = "all"
statement     = "Admission accepts a fence iff resolved ⊆ delegated ∪ closure on every axis; any widening (Superset) is refused."
lean_theorem  = ["Ceremony.Assurance.admission_sound", "Ceremony.Assurance.no_silent_widening", "Ceremony.Assurance.widening_refused"]
tla_invariant = ["T2_NoSilentWiden@AuthorityLifecycle_SilentWiden.cfg", "T3_AppliedWithinClaim@AuthorityLifecycle_AppliedExceedsClaim.cfg"]
rust_test     = ["admit_admits_within_and_rejects_widening", "relate_orientation_matches_within", "union_expands_and_absorbs"]
native_test   = []
premise       = "none"
status        = "proved"

