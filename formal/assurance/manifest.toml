# Assurance manifest (Phase 7) — security claims as GENERATED DATA, not prose.
#
# Each [[claim]] links a security property to the artifacts that establish it:
#   lean_theorem   — a theorem in the formal/ Lake project (axiom-audited)
#   tla_invariant  — an invariant in a formal/tla spec, + the cfg that checks it
#   rust_test      — a #[test] proving model≈production semantics
#   native_test    — the hostile-child test proving OS≈production (per platform)
#   evidence_cid   — content-address of the native evidence artifact, via the
#                    EXISTING ceremony CID machinery. That layer is HELD (not yet
#                    wired to a concrete hash — see assumptions.md ASM-CID), so
#                    these read "held:phase1d" until Phase-1d freezes the vectors.
#   status         — proved | partial | held
#
# validate.sh checks every reference here RESOLVES (theorem name present in Lean
# source, invariant + cfg present, rust test present, native test file present).
# A dangling reference fails the assurance gate.

schema_version = "0.1.0"
production_sha = "37fef8dbef0968c16ddd0f1acb0a4db7ac3ad3ed"
algebra_crate  = "agent-mesh-protocol@0.6.4"

# ── The headline Windows E2 claim (seed of this work) ────────────────────────
[[claim]]
id            = "WIN-E2-WRITE-READ"
platform      = "windows"
statement     = "Under the AppContainer projection (resolved.fs_read = delegated.fs_read ∪ delegated.fs_write), a config whose write paths are not a subset of its read paths is a read-axis widening and an exact/narrow admission MUST refuse it."
lean_theorem  = ["Ceremony.Assurance.windows_write_implies_read_widening", "Ceremony.Assurance.windows_unrepresentable_narrowing_rejected"]
tla_invariant = ["T3_AppliedWithinClaim@AuthorityLifecycle_AppliedExceedsClaim.cfg"]
rust_test     = ["windows_write_without_read_triggers_widening_and_is_rejected", "windows_write_subset_of_read_admits", "windows_union_membership_is_exact"]
native_test   = ["agent-bridle-aclaunch/tests/kernel_proofs.rs"]
evidence_cid  = "held:phase1d"
impl_sha      = "523038d827a92bf564b9b115ef8449eb8555100a"  # PR #338 head, MERGED to main @ ef74ee2
premise       = "ASM-WIN-DACL: the aclaunch DACL grants content read on every write path (main.rs:476, FILE_GENERIC_READ_WRITE). Empirically established by #338 native DACL evidence (kernel_proofs.rs::fs_write_grant_confers_read_e2 + icacls AppContainer-SID mask (R,W)), NOT proved."
status        = "established"   # model PROVED (Lean); native probe LANDED (#338 merged @ ef74ee2)

