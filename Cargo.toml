[workspace]
resolver = "2"
members = [
    "agent-bridle-core",
    "agent-bridle-fdguard",
    "agent-bridle-ceremony",
    "agent-bridle-config",
    "agent-bridle-aclaunch",
    "agent-bridle-jaild",
    "agent-bridle-tool-shell",
    "agent-bridle-tool-web",
    "agent-bridle",
    "agent-bridle-mcp",
    "agent-bridle-py",
    "agent-bridle-gateway",
]

[workspace.package]
version = "0.8.0-rc.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Gilamonster-Foundation/agent-bridle"
authors = ["Shawn Hartsock <hartsock@users.noreply.github.com>"]

[workspace.dependencies]
# In-workspace crates (lock-step version).
agent-bridle-core = { version = "0.8.0-rc.2", path = "agent-bridle-core" }
# The single unsafe-permitting seam (fd hygiene on confined spawn, #319) so core
# can stay `forbid(unsafe_code)`. Published (ADR 0008) because core depends on it.
agent-bridle-fdguard = { version = "0.8.0-rc.2", path = "agent-bridle-fdguard" }
agent-bridle-tool-shell = { version = "0.8.0-rc.2", path = "agent-bridle-tool-shell" }
agent-bridle-tool-web = { version = "0.8.0-rc.2", path = "agent-bridle-tool-web" }
# `default-features = false` here so `agent-bridle-mcp` controls the facade's
# feature set (its own `shell`/`--no-default-features` forward through).
agent-bridle = { version = "0.8.0-rc.2", path = "agent-bridle", default-features = false }

# The leash. One canonical authority type, shared across the whole agent line.
agent-mesh-protocol = "0.6.4"

# Core (lean) deps — these are the ONLY non-mesh deps allowed in core.
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
async-trait = "0.1"

# PyO3 — only the `agent-bridle-py` wheel turns this on (default-feature
# builds of the rest of the workspace never touch it). `extension-module` is
# enabled at the crate, not here, so any non-wheel consumer stays clean.
pyo3 = { version = "0.28", default-features = false, features = ["macros"] }

# Leaf-tool-only runtime (never enters core). The safe-subset, sandboxed-host,
# and carried Brush workers select the exact Tokio features they need through
# their leaf crate features.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
# The publishable `brush-ocap-*` fork and focused uutils components are declared
# only in `agent-bridle-tool-shell`; keeping them out of workspace/core
# dependencies preserves the lean default construction boundary.

# Web-tool-only deps (feature `web` in agent-bridle-tool-web). rustls, NOT
# openssl, so the client is portable and builds on Windows with no system
# OpenSSL. `charset`/`gzip` for real-world pages; default features off so we do
# not drag in the openssl-tls path.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "charset",
    "gzip",
] }
url = "2"
hickory-resolver = "0.24"
dom_smoothie = "0.17"
htmd = "0.5"

[profile.release]
# strip + thin-LTO is the verified real-world trigger for linker DCE silently
# dropping a self-registered (`inventory`) tool from `tools/list` (DESIGN §5).
# We exercise that hazard deliberately, but because P0 uses EXPLICIT
# `Registry::builder()` registration (anchored by facade `pub use`), it is safe.
strip = true
lto = "thin"
